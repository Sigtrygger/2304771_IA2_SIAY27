<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Ticket | Coding Conf</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="../assets/logo.svg" alt="" width="36" height="36">
      <span>Coding Conf</span>
    </a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <section class="ticket-section" aria-labelledby="congrats">
      <h1 id="congrats">Congrats, <span class="gradient-text" id="ticketName">Guest</span>! Your ticket is ready.</h1>
      <p class="lead" id="ticketEmailMsg">We'll send details to your email.</p>

      <article class="ticket" aria-label="Conference ticket">
        <span class="serial" id="ticketSerial">#00000</span>
        <div class="ticket-brand">
          <img src="../assets/logo.svg" alt="Coding Conf logo" width="48" height="48">
          <div>
            <h2>Coding Conf 2026</h2>
            <p>October 26, 2026 / Papine, Kgn</p>
          </div>
        </div>
        <div class="ticket-body">
          <img class="avatar" id="ticketAvatar" src="../assets/logo.svg"
               alt="Profile picture of attendee" width="96" height="96">
          <p class="attendee" id="ticketFullName"></p>
          <a id="ticketGithub" href="https://github.com/" target="_blank" rel="noopener"></a>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Coding Conf. CIT2011 Web Programming IA#2.</p>
  </footer>

  <script src="../js/ticket.js"></script>
</body>
</html>
